<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ShazaQobuz</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #f2f2f7;
  --card: #ffffff;
  --border: rgba(0,0,0,0.08);
  --text: #1c1c1e;
  --text2: #6e6e73;
  --text3: #aeaeb2;
  --accent: #007aff;
  --accent-bg: rgba(0,122,255,0.1);
  --green: #34c759;
  --green-bg: rgba(52,199,89,0.1);
  --red: #ff3b30;
  --shadow: 0 2px 20px rgba(0,0,0,0.07);
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.header {
  width: 100%;
  max-width: 480px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 56px 20px 16px;
}

.app-title {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.5px;
}

.app-title span { color: var(--accent); }

.menu-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--card);
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow);
  font-size: 16px;
  transition: transform 0.15s;
}
.menu-btn:active { transform: scale(0.92); }

.container {
  width: 100%;
  max-width: 480px;
  padding: 0 20px 40px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* Record card */
.record-card {
  background: var(--card);
  border-radius: 24px;
  padding: 40px 24px;
  text-align: center;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}

.record-wrap {
  position: relative;
  width: 140px;
  height: 140px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Pulse rings */
.ring {
  position: absolute;
  border-radius: 50%;
  border: 1.5px solid var(--accent);
  opacity: 0;
  pointer-events: none;
}
.ring-1 { inset: -14px; }
.ring-2 { inset: -28px; }

.recording .ring-1 { animation: pulse 1.6s ease-out infinite; }
.recording .ring-2 { animation: pulse 1.6s ease-out infinite 0.35s; }

@keyframes pulse {
  0%   { opacity: 0.5; transform: scale(0.96); }
  100% { opacity: 0;   transform: scale(1.04); }
}

.record-btn {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  background: var(--accent);
  box-shadow: 0 6px 28px rgba(0,122,255,0.38);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 42px;
  transition: all 0.2s ease;
  position: relative;
  z-index: 1;
}
.record-btn:active { transform: scale(0.93); }
.record-btn.recording { background: var(--red); box-shadow: 0 6px 28px rgba(255,59,48,0.38); }
.record-btn.loading  { background: #8e8e93; box-shadow: 0 4px 20px rgba(0,0,0,0.15); }

.loading #btn-icon { display: inline-block; animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.record-label {
  font-size: 14px;
  font-weight: 500;
  color: var(--text2);
}

.timer {
  font-size: 15px;
  font-weight: 600;
  color: var(--red);
  min-height: 18px;
  font-variant-numeric: tabular-nums;
}

/* Result */
.result-card {
  background: var(--card);
  border-radius: 20px;
  padding: 18px;
  box-shadow: var(--shadow);
  display: none;
  animation: pop 0.32s cubic-bezier(0.34,1.5,0.64,1);
}
.result-card.visible { display: block; }

@keyframes pop {
  from { opacity: 0; transform: scale(0.96) translateY(10px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}

.result-row {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 14px;
}

.track-thumb {
  width: 54px;
  height: 54px;
  border-radius: 10px;
  background: var(--accent-bg);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  flex-shrink: 0;
}

.track-info { flex: 1; min-width: 0; }

.track-title {
  font-size: 16px;
  font-weight: 600;
  letter-spacing: -0.2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.track-artist {
  font-size: 14px;
  color: var(--accent);
  font-weight: 500;
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.track-album {
  font-size: 12px;
  color: var(--text3);
  margin-top: 1px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.result-btns { display: flex; gap: 10px; }

.btn-add {
  flex: 1;
  padding: 13px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 13px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  letter-spacing: -0.2px;
  transition: opacity 0.15s;
}
.btn-add:active { opacity: 0.82; }
.btn-add:disabled { opacity: 0.35; cursor: default; }

.btn-skip {
  padding: 13px 18px;
  background: var(--bg);
  color: var(--text2);
  border: none;
  border-radius: 13px;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  transition: opacity 0.15s;
}
.btn-skip:active { opacity: 0.7; }

.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  font-weight: 500;
  padding: 3px 9px;
  border-radius: 7px;
  margin-top: 8px;
}
.badge.ok  { background: var(--green-bg); color: var(--green); }
.badge.err { background: rgba(255,59,48,0.1); color: var(--red); }

.result-error {
  font-size: 14px;
  color: var(--text2);
  text-align: center;
  padding: 6px 0;
}

/* History */
.history-card {
  background: var(--card);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: var(--shadow);
}

.history-top {
  padding: 16px 20px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
}

.history-title { font-size: 15px; font-weight: 600; }

.history-badge {
  font-size: 12px;
  font-weight: 500;
  color: var(--text3);
  background: var(--bg);
  padding: 2px 10px;
  border-radius: 10px;
}

.history-list { max-height: 260px; overflow-y: auto; }
.history-list::-webkit-scrollbar { display: none; }

.h-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  animation: pop 0.25s ease;
}
.h-item:last-child { border-bottom: none; }

.h-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.h-dot.ok  { background: var(--green); }
.h-dot.err { background: var(--red); }

.h-info { flex: 1; min-width: 0; }
.h-track  { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.h-artist { font-size: 12px; color: var(--text3); margin-top: 1px; }
.h-time   { font-size: 12px; color: var(--text3); font-variant-numeric: tabular-nums; }

.h-empty {
  padding: 24px;
  text-align: center;
  font-size: 14px;
  color: var(--text3);
}

.refresh-btn {
  background: none;
  border: none;
  font-size: 18px;
  color: var(--text2);
  cursor: pointer;
  padding: 2px 6px;
  border-radius: 6px;
  transition: color 0.15s;
}
.refresh-btn:active { color: var(--accent); }

.qobuz-link {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--card);
  border-radius: 16px;
  padding: 16px 20px;
  margin-top: 12px;
  text-decoration: none;
  color: var(--text);
  box-shadow: var(--shadow);
  font-size: 15px;
  font-weight: 500;
  transition: opacity 0.15s;
}
.qobuz-link:active { opacity: 0.75; }
.qobuz-arrow { margin-left: auto; color: var(--text3); font-size: 18px; }

.lastfm-cover {
  width: 40px; height: 40px;
  border-radius: 8px;
  background: var(--bg);
  object-fit: cover;
  flex-shrink: 0;
}

.lastfm-cover-placeholder {
  width: 40px; height: 40px;
  border-radius: 8px;
  background: var(--bg);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
}

.h-playing {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--accent);
  flex-shrink: 0;
  animation: blink 1s ease-in-out infinite;
}
@keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0.2; } }

/* ── Suggestion cards ── */
.suggestion-section {
  margin-top: 10px;
  border-top: 1px solid var(--border);
  padding-top: 14px;
}
.suggestion-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 8px;
}
.suggestion-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 4px;
}
.suggestion-info { flex: 1; min-width: 0; }
.suggestion-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.suggestion-artist {
  font-size: 12px;
  color: var(--text2);
  margin-top: 1px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.suggestion-btns { display: flex; gap: 6px; flex-shrink: 0; }
.btn-sugg-listen {
  padding: 7px 11px;
  background: var(--bg);
  color: var(--text2);
  border: 1px solid var(--border);
  border-radius: 10px;
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.15s;
}
.btn-sugg-listen:active { background: var(--border); }
.btn-sugg-add {
  padding: 7px 11px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: opacity 0.15s;
}
.btn-sugg-add:active { opacity: 0.82; }
.btn-sugg-add:disabled { opacity: 0.35; cursor: default; }
.sugg-loading { font-size: 12px; color: var(--text3); padding: 4px 0; }

/* Settings sheet */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.38);
  z-index: 100;
  display: none;
  align-items: flex-end;
  justify-content: center;
  backdrop-filter: blur(3px);
}
.overlay.open { display: flex; }

.sheet {
  width: 100%;
  max-width: 480px;
  background: var(--card);
  border-radius: 24px 24px 0 0;
  padding: 10px 24px 44px;
  animation: sheet-in 0.3s cubic-bezier(0.34,1.2,0.64,1);
}
@keyframes sheet-in {
  from { transform: translateY(100%); }
  to   { transform: translateY(0); }
}

.handle {
  width: 36px; height: 4px;
  border-radius: 2px;
  background: var(--border);
  margin: 0 auto 20px;
}

.sheet-title {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.3px;
  margin-bottom: 20px;
}

.field { margin-bottom: 14px; }
.field label {
  display: block;
  font-size: 12px;
  font-weight: 500;
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 6px;
}
.field input {
  width: 100%;
  background: var(--bg);
  border: 1.5px solid transparent;
  border-radius: 12px;
  padding: 12px 14px;
  color: var(--text);
  font-family: 'Menlo', monospace;
  font-size: 13px;
  outline: none;
  transition: border-color 0.2s;
}
.field input:focus { border-color: var(--accent); }

.btn-save {
  width: 100%;
  padding: 15px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 14px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 4px;
  letter-spacing: -0.2px;
  transition: opacity 0.15s;
}
.btn-save:active { opacity: 0.85; }

/* ── Radio Paradise ── */
.rp-logo-img {
  height: 32px; width: 32px;
  border-radius: 6px;
  object-fit: cover;
  display: block;
}
.btn-rp-add {
  flex: 1;
  padding: 13px;
  background: #F5A623;
  color: #000;
  border: none;
  border-radius: 13px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  letter-spacing: -0.2px;
  transition: opacity 0.15s;
}
.btn-rp-add:active { opacity: 0.82; }
.btn-rp-add:disabled { opacity: 0.35; cursor: default; }
.rp-main-btn {
  width: 100%;
  padding: 15px;
  background: #F5A623;
  color: #000;
  border: none;
  border-radius: 14px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  letter-spacing: -0.2px;
  transition: opacity 0.15s;
  margin-bottom: 4px;
}
.rp-main-btn:active { opacity: 0.82; }
.rp-rock-btn {
  width: 100%;
  padding: 15px;
  background: #E8450A;
  color: #fff;
  border: none;
  border-radius: 14px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  letter-spacing: -0.2px;
  transition: opacity 0.15s;
  margin-bottom: 4px;
}
.rp-rock-btn:active { opacity: 0.82; }
.btn-rock-add {
  flex: 1;
  padding: 13px;
  background: #E8450A;
  color: #fff;
  border: none;
  border-radius: 13px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  letter-spacing: -0.2px;
  transition: opacity 0.15s;
}
.btn-rock-add:active { opacity: 0.82; }
.btn-rock-add:disabled { opacity: 0.35; cursor: default; }
.rock-live-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #E8450A;
  animation: blink 1s ease-in-out infinite;
  flex-shrink: 0;
}
.rp-live-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #F5A623;
  animation: blink 1s ease-in-out infinite;
  flex-shrink: 0;
}
.fh-item.rp-selected { background: rgba(245,166,35,0.06); }
.fh-item.rp-selected .fh-check { background: #F5A623; border-color: #F5A623; }

/* ── FIP cards ── */
.fip-card {
  background: var(--card);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: var(--shadow);
}

.fip-top {
  padding: 16px 20px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
}

.fip-top-left { display: flex; align-items: center; gap: 10px; }

.fip-badge {
  font-size: 11px;
  font-weight: 600;
  color: #fff;
  background: #E2007A;
  padding: 3px 8px;
  border-radius: 6px;
  letter-spacing: 0.03em;
}

.fip-card-title { font-size: 15px; font-weight: 600; }

.fip-fetch-btn {
  background: none;
  border: none;
  font-size: 18px;
  color: var(--text2);
  cursor: pointer;
  padding: 2px 6px;
  border-radius: 6px;
  transition: color 0.15s;
}
.fip-fetch-btn:active { color: #E2007A; }

.fip-body { padding: 16px 20px; }

.fip-now-row {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 14px;
}

.fip-thumb {
  width: 54px; height: 54px;
  border-radius: 10px;
  background: rgba(226,0,122,0.10);
  display: flex; align-items: center; justify-content: center;
  font-size: 26px; flex-shrink: 0;
}

.fip-live-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #E2007A;
  animation: blink 1s ease-in-out infinite;
  flex-shrink: 0;
}

.fip-empty {
  padding: 20px 0 6px;
  text-align: center;
  font-size: 14px;
  color: var(--text3);
}

.btn-fip-add {
  flex: 1;
  padding: 13px;
  background: #E2007A;
  color: #fff;
  border: none;
  border-radius: 13px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  letter-spacing: -0.2px;
  transition: opacity 0.15s;
}
.btn-fip-add:active { opacity: 0.82; }
.btn-fip-add:disabled { opacity: 0.35; cursor: default; }

/* ── Historique FIP ── */
.fip-date-row {
  display: flex;
  gap: 10px;
  align-items: center;
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
}

.fip-date-row input[type=date] {
  flex: 1;
  background: var(--bg);
  border: 1.5px solid transparent;
  border-radius: 12px;
  padding: 10px 12px;
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
  font-size: 15px;
  outline: none;
  transition: border-color 0.2s;
}
.fip-date-row input[type=date]:focus { border-color: #E2007A; }
.fip-date-row input[type=date]::-webkit-calendar-picker-indicator { opacity: 0.5; }

.btn-load {
  padding: 10px 16px;
  background: #E2007A;
  color: #fff;
  border: none;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: opacity 0.15s;
}
.btn-load:active { opacity: 0.82; }
.btn-load:disabled { opacity: 0.38; cursor: default; }

.fip-select-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 20px;
  border-bottom: 1px solid var(--border);
}

.fip-select-label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--text2);
  cursor: pointer;
}
.fip-select-label input[type=checkbox] { accent-color: #E2007A; width: 16px; height: 16px; }

.btn-scrobble-all {
  padding: 8px 14px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.15s;
}
.btn-scrobble-all:disabled { opacity: 0.3; cursor: default; }
.btn-scrobble-all:active { opacity: 0.82; }

.fip-hist-list { max-height: 52vh; overflow-y: auto; }
.fip-hist-list::-webkit-scrollbar { display: none; }

.fh-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 20px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background 0.15s;
}
.fh-item:last-child { border-bottom: none; }
.fh-item:active { background: var(--bg); }
.fh-item.selected { background: rgba(226,0,122,0.06); }
.fh-item.done { opacity: 0.5; cursor: default; }

.fh-check {
  width: 20px; height: 20px;
  border-radius: 6px;
  border: 1.5px solid var(--border);
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px;
  color: #fff;
  transition: all 0.15s;
}
.fh-item.selected .fh-check { background: #E2007A; border-color: #E2007A; }
.fh-item.done .fh-check { background: var(--green); border-color: var(--green); }

.fh-info { flex: 1; min-width: 0; }
.fh-track  { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fh-artist { font-size: 12px; color: var(--text3); margin-top: 1px; }
.fh-time   { font-size: 12px; color: var(--text3); font-variant-numeric: tabular-nums; flex-shrink: 0; }

.fip-logo-img {
  height: 32px; width: 32px;
  border-radius: 6px;
  object-fit: cover;
  display: block;
}

.fip-main-btn {
  width: 100%;
  padding: 15px;
  background: #E2007A;
  color: #fff;
  border: none;
  border-radius: 14px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  letter-spacing: -0.2px;
  transition: opacity 0.15s;
  margin-bottom: 4px;
}
.fip-main-btn:active { opacity: 0.82; }
</style>
</head>
<body>

<div class="header">
  <div class="app-title">Shaza<span>Qobuz</span></div>
  <button class="menu-btn" onclick="openSettings()">⚙️</button>
</div>

<div class="container">

  <div class="record-card">
    <div class="record-wrap" id="record-wrap">
      <div class="ring ring-1"></div>
      <div class="ring ring-2"></div>
      <button class="record-btn" id="record-btn" onclick="toggleRecord()">
        <span id="btn-icon">🎵</span>

// ── State ─────────────────────────────────────────────────────────────────────
let isRecording=false, mediaRecorder=null, audioChunks=[], timerInt=null, secs=0, currentTrack=null, history=[];

// ── Record ────────────────────────────────────────────────────────────────────
async function toggleRecord() {
  if (isRecording) stopRecording(); else await startRecording();
}

async function startRecording() {
  const k = keys();
  if (!k.audd || !k.lfKey || !k.lfSession) {
    openSettings();
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.onstop = processAudio;
    mediaRecorder.start();
    isRecording = true; secs = 0;
    document.getElementById('result-card').className = 'result-card';
    setRecordState('recording', '⏹', 'En écoute — appuyer pour arrêter');
    document.getElementById('timer').textContent = '0s';
    timerInt = setInterval(() => {
      secs++;
      document.getElementById('timer').textContent = secs + 's';
      if (secs >= 15) stopRecording();
    }, 1000);
  } catch(e) {
    document.getElementById('record-label').textContent = '❌ Accès micro refusé';
  }
}

function stopRecording() {
  if (!mediaRecorder) return;
  clearInterval(timerInt);
  mediaRecorder.stop();
  mediaRecorder.stream.getTracks().forEach(t => t.stop());
  isRecording = false;
  setRecordState('loading', '⟳', 'Analyse en cours...');
  document.getElementById('timer').textContent = '';
}

function setRecordState(cls, icon, label) {
  document.getElementById('record-btn').className = 'record-btn ' + cls;
  document.getElementById('record-wrap').className = 'record-wrap ' + cls;
  document.getElementById('btn-icon').textContent = icon;
  document.getElementById('record-label').textContent = label;
}

function resetBtn() { setRecordState('', '🎵', 'Appuyer pour reconnaître'); }

// ── AudD ──────────────────────────────────────────────────────────────────────
async function processAudio() {
  const k = keys();
  const fd = new FormData();
  fd.append('file', new Blob(audioChunks, { type: 'audio/webm' }), 'audio.webm');
  fd.append('api_token', k.audd);
  try {
    const r = await fetch('https://api.audd.io/', { method: 'POST', body: fd });
    const d = await r.json();
    if (d.status === 'success' && d.result) {
      currentTrack = { title: d.result.title, artist: d.result.artist, album: d.result.album || '' };
      showFound(currentTrack);
    } else {
      showErr('Morceau non reconnu. Réessaie avec plus de son.');
    }
  } catch(e) { showErr('Erreur réseau.'); }
  resetBtn();
}

function showFound(t) {
  const card = document.getElementById('result-card');
  card.innerHTML = `
    <div class="result-row">
      <div class="track-thumb">🎵</div>
      <div class="track-info">
        <div class="track-title">${t.title}</div>
        <div class="track-artist">${t.artist}</div>
        ${t.album ? `<div class="track-album">${t.album}</div>` : ''}
      </div>
    </div>
    <div class="result-btns">
      <button class="btn-add" id="btn-add" onclick="scrobble()">Ajouter à Qobuz</button>
      <button class="btn-skip" onclick="document.getElementById('result-card').className='result-card'">Ignorer</button>
    </div>
`;
  card.className = 'result-card visible';
}

function showErr(msg) {
  const card = document.getElementById('result-card');
  card.innerHTML = `<div class="result-error">😕 ${msg}</div>`;
  card.className = 'result-card visible';
}

// ── Scrobble ──────────────────────────────────────────────────────────────────
async function scrobble() {
  const t = currentTrack;
  if (!t) return;
  const btn = document.getElementById('btn-add');
  btn.disabled = true; btn.textContent = 'Envoi...';
  const ok = await scrobbleTrack(t.title, t.artist);
  if (ok) {
    setTimeout(loadLastfmRecent, 2000);

    document.getElementById('result-card').innerHTML = `

        </div>
      </div>`;
  } else {
    showErr('Erreur Last.fm — vérifie tes clés');
  }
}

// ── UTF-8 aware MD5 using SubtleCrypto ───────────────────────────────────────
async function md5utf8(str) {
  // Encode string as UTF-8 bytes
  const encoder = new TextEncoder();
  const data = encoder.encode(str);
  // Use SubtleCrypto MD5 if available, otherwise fall back to manual UTF-8 MD5
  try {
    const hashBuffer = await crypto.subtle.digest('MD5', data);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
  } catch(e) {
    // SubtleCrypto doesn't support MD5 in most browsers, use manual UTF-8 approach
    return md5(unescape(encodeURIComponent(str)));
  }
}

// ── Suggestions basées sur les goûts de l'utilisateur ────────────────────────
async function loadSuggestions() {
  const k = keys();
  const zone = document.getElementById('suggestions-zone');
  if (!zone || !k.lfKey) return;
  zone.innerHTML = '<div class="h-empty">Chargement…</div>';

  try {
    // 1. Récupère les top tracks de l'utilisateur
    const topUrl = `https://ws.audioscrobbler.com/2.0/?method=user.getTopTracks&user=daubresse&api_key=${k.lfKey}&limit=50&period=3month&format=json`;
    const topRes  = await fetch(topUrl);
    const topData = await topRes.json();
    const topTracks = topData.toptracks?.track;
    if (!topTracks || !topTracks.length) {
      zone.innerHTML = '<div class="h-empty">Pas encore assez d'écoutes pour des suggestions.</div>';
      return;
    }

    // 2. Prend un titre au hasard parmi le top
    const pivot = topTracks[Math.floor(Math.random() * Math.min(topTracks.length, 20))];

    // 3. Récupère des titres similaires
    const simUrl = `https://ws.audioscrobbler.com/2.0/?method=track.getSimilar&artist=${encodeURIComponent(pivot.artist?.name || pivot.artist)}&track=${encodeURIComponent(pivot.name)}&api_key=${k.lfKey}&limit=30&format=json`;
    const simRes  = await fetch(simUrl);
    const simData = await simRes.json();
    const similar = simData.similartracks?.track;

    if (!similar || similar.length < 2) {
      zone.innerHTML = '<div class="h-empty">Suggestions indisponibles, réessaie.</div>';
      return;
    }

    // s1 = le plus proche, s2 = pioché plus loin pour la découverte
    const s1 = similar[0];
    const s2idx = Math.floor(Math.random() * Math.min(15, similar.length - 5)) + 5;
    const s2 = similar[Math.min(s2idx, similar.length - 1)];

    zone.innerHTML = `
      <div style="padding:0 20px 6px;font-size:11px;color:var(--text3)">Basé sur <em>${pivot.name}</em></div>
      <div style="padding:0 20px 10px">
        <div class="suggestion-label">🎯 Tu vas aimer</div>
        <div class="suggestion-row">
          <div class="suggestion-info">
            <div class="suggestion-title">${s1.name}</div>
            <div class="suggestion-artist">${s1.artist?.name || s1.artist}</div>
          </div>
          <div class="suggestion-btns">
            <button class="btn-sugg-listen" onclick="listenOnQobuz('${escQ(s1.name)}','${escQ(s1.artist?.name || s1.artist)}')">▶ Qobuz</button>
            <button class="btn-sugg-add" onclick="scrobbleSugg('${escQ(s1.name)}','${escQ(s1.artist?.name || s1.artist)}',this)">+ Ajouter</button>
          </div>
        </div>
        <div class="suggestion-label" style="margin-top:10px">🔍 Découvre ça</div>
        <div class="suggestion-row">
          <div class="suggestion-info">
            <div class="suggestion-title">${s2.name}</div>
            <div class="suggestion-artist">${s2.artist?.name || s2.artist}</div>
          </div>
          <div class="suggestion-btns">
            <button class="btn-sugg-listen" onclick="listenOnQobuz('${escQ(s2.name)}','${escQ(s2.artist?.name || s2.artist)}')">▶ Qobuz</button>
            <button class="btn-sugg-add" onclick="scrobbleSugg('${escQ(s2.name)}','${escQ(s2.artist?.name || s2.artist)}',this)">+ Ajouter</button>
          </div>
        </div>
      </div>`;
  } catch(e) {
    zone.innerHTML = '<div class="h-empty">Erreur de chargement.</div>';
  }
}

function escQ(str) {
  return (str || '').replace(/'/g, "\'").replace(/"/g, '&quot;');
}

function listenOnQobuz(title, artist) {
  const q = encodeURIComponent(artist + ' ' + title);
  window.open('https://open.qobuz.com/search?q=' + q, '_blank');
}

async function scrobbleSugg(title, artist, btn) {

  const ok = await scrobbleTrack(title, artist);

    btn.style.background = 'var(--green)';
    setTimeout(loadLastfmRecent, 2000);

    btn.textContent = '✕';
    btn.style.background = 'var(--red)';
    setTimeout(() => { btn.disabled=false; btn.textContent='+ Ajouter'; btn.style.background=''; }, 2000);
  }
}

async function loadLastfmRecent() {
  const k = keys();
  const list = document.getElementById('lastfm-list');
  list.innerHTML = '<div class="h-empty">Chargement…</div>';
  try {
    const url = `https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=daubresse&api_key=${k.lfKey}&limit=10&format=json`;
    const res  = await fetch(url);
    const data = await res.json();
    const tracks = data.recenttracks?.track;
    if (!tracks || !tracks.length) {
      list.innerHTML = '<div class="h-empty">Aucun scrobble trouvé</div>';
      return;
    }
    list.innerHTML = tracks.map(t => {
      const isNow = t['@attr']?.nowplaying === 'true';
      const cover = t.image?.find(i => i.size === 'medium')?.['#text'];
      const coverEl = cover
        ? `<img class="lastfm-cover" src="${cover}" alt="" />`
        : `<div class="lastfm-cover-placeholder">🎵</div>`;
      const dateEl = isNow
        ? `<div class="h-playing"></div>`
        : `<div class="h-time">${formatLastfmDate(t.date?.['#text'] || '')}</div>`;
      return `
        <div class="h-item">
          ${coverEl}
          <div class="h-info">
            <div class="h-track">${t.name}</div>
            <div class="h-artist">${t.artist?.['#text'] || t.artist}</div>
          </div>
          ${dateEl}
        </div>`;
    }).join('');
  } catch(e) {
    list.innerHTML = '<div class="h-empty">Erreur de chargement</div>';
  }
}

function formatLastfmDate(str) {
  if (!str) return '';
  const d = new Date(str + ' UTC');
  const now = new Date();
  const diff = Math.floor((now - d) / 60000);
  if (diff < 1)  return 'maintenant';
  if (diff < 60) return diff + 'min';
  if (diff < 1440) return Math.floor(diff/60) + 'h';
  return Math.floor(diff/1440) + 'j';
}

// ── FIP Direct ──────────────────────────────────────────────────────────────
let fipCurrentTrack = null;

async function fetchWithTimeout(url, ms=8000, options={}) {
  const ctrl = new AbortController();
  const id = setTimeout(() => ctrl.abort(), ms);
  try {
    const res = await fetch(url, { ...options, signal: ctrl.signal });
    clearTimeout(id);
    return res;
  } catch(e) { clearTimeout(id); throw e; }
}

async function parseFipLivemeta(raw) {
  const data  = typeof raw === 'string' ? JSON.parse(raw) : raw;
  const level = data.levels[data.levels.length - 1];
  const uid   = level.items[level.position];
  const step  = data.steps[uid];
  if (step && step.title) return { title: step.title, artist: step.authors || step.performers || '' };
  return null;
}

async function fetchFipNow() {
  const body = document.getElementById('fip-now-body');
  body.innerHTML = '<div class="fip-empty">Chargement…</div>';
  document.getElementById('fip-hist-list').style.display = 'none';
  document.getElementById('fip-select-controls').style.display = 'none';
  setFipHistStatus('', false);

  const TARGET = 'https://api.radiofrance.fr/livemeta/pull/7';
  const PROXIES = [
    u => `https://corsproxy.io/?${encodeURIComponent(u)}`,
    u => `https://api.allorigins.win/get?url=${encodeURIComponent(u)}`,
    u => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
  ];

  const bust = '&_=' + Date.now();
  for (const proxy of PROXIES) {
    try {
      const res  = await fetchWithTimeout(proxy(TARGET) + bust, 7000);
      const json = await res.json();
      const raw  = json.contents !== undefined ? json.contents : JSON.stringify(json);
      const data = typeof raw === 'string' ? JSON.parse(raw) : raw;

      // Titre en cours
      const track = await parseFipLivemeta(data);
      if (track) {
        fipCurrentTrack = track;
        body.innerHTML = `
          <div class="fip-now-row">
            <div class="fip-thumb">📻</div>
            <div class="track-info">
              <div class="track-title">${track.title}</div>
              <div class="track-artist" style="color:#E2007A">${track.artist}</div>
            </div>
            <div class="fip-live-dot"></div>
          </div>
          <div class="result-btns">
            <button class="btn-fip-add" id="btn-fip-add" onclick="scrobbleFipNow()">Ajouter à Qobuz</button>
            <button class="btn-skip" onclick="dismissFipNow()">Ignorer</button>
          </div>`;
      } else {
        body.innerHTML = '<div class="fip-empty">Pas de titre musical en ce moment sur FIP</div>';
      }

      // Titres récents en dessous (cochables) — on exclut le titre en cours
      const currentTitle = track ? track.title : null;
      const now = Math.floor(Date.now() / 1000);
      const allSteps = Object.values(data.steps || {})
        .filter(s => s.title && s.title !== currentTitle && s.start <= now)
        .sort((a, b) => b.start - a.start);
      if (allSteps.length) {
        const seen = new Set();
        histTracks = allSteps.reduce((acc, s) => {
          const key = (s.title + '|' + (s.authors || s.performers || '')).toLowerCase();
          if (!seen.has(key)) { seen.add(key); acc.push({
            title: s.title, artist: s.authors || s.performers || '',
            time:  new Date(s.start * 1000).toLocaleTimeString('fr-FR', {hour:'2-digit',minute:'2-digit'}),
            ts: s.start, selected: false, done: false
          }); }
          return acc;
        }, []);
        document.getElementById('fip-hist-list').style.display = 'block';
        renderHist();
      }
      return;
    } catch(e) { /* essaie le proxy suivant */ }
  }
  body.innerHTML = `<div class="fip-empty">Impossible de joindre FIP. Réessaie.</div>`;
}

async function scrobbleFipNow() {
  if (!fipCurrentTrack) return;
  const btn = document.getElementById('btn-fip-add');
  btn.disabled = true; btn.textContent = 'Envoi…';
  const ok = await scrobbleTrack(fipCurrentTrack.title, fipCurrentTrack.artist);

}

function dismissFipNow() {
  fipCurrentTrack = null;

  document.getElementById('fip-hist-list').style.display = 'none';
  document.getElementById('fip-select-controls').style.display = 'none';
}

// Factorisation scrobble (utilisé par Shazam + FIP Direct)
async function scrobbleTrack(title, artist) {
  const k = keys();
  if (!k.lfKey || !k.lfSession) return false;
  const ts = Math.floor(Date.now()/1000).toString();
  const clean = s => (s || '').trim();
  const sp = { api_key: clean(k.lfKey), artist: clean(artist), method: 'track.scrobble', sk: clean(k.lfSession), timestamp: ts, track: clean(title) };
  const sigStr = Object.keys(sp).sort().reduce((acc, key) => acc + key + sp[key], '') + clean(k.lfSecret);
  const api_sig = md5(unescape(encodeURIComponent(sigStr)));
  try {
    const res = await fetch('https://ws.audioscrobbler.com/2.0/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({ ...sp, api_sig, format: 'json' }).toString(),
    });
    const data = await res.json();
    return !data.error;
  } catch(e) { return false; }
}

// ── FIP Historique ──────────────────────────────────────────────────────────
let histTracks = [];

function initFipDate() {
  const el = document.getElementById('fip-date');
  if (!el.value) {
    const d = new Date();
    d.setDate(d.getDate() - 1);
    el.value = d.toISOString().slice(0, 10);
  }
}

async function loadFipHistory() {
  const dateVal = document.getElementById('fip-date').value;
  if (!dateVal) return;
  const btn = document.getElementById('btn-load');
  btn.disabled = true; btn.textContent = '…';
  const list = document.getElementById('fip-hist-list');
  list.innerHTML = '<div class="h-empty">Chargement…</div>';
  setFipHistStatus('', false);

  const dateObj = new Date(dateVal + 'T00:00:00');
  const tsStart = Math.floor(dateObj.getTime() / 1000);
  const tsEnd   = tsStart + 86400;

  // 1. GraphQL FIP direct (avec variables correctes)
  try {
    const res = await fetchWithTimeout('https://www.fip.fr/latest/api/graphql', 8000, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        query: `{ timelineSongs(start:${tsStart} end:${tsEnd} stationId:7) { startTime song { title interpreters } } }`
      })
    });
    const json = await res.json();
    const songs = json.data?.timelineSongs;
    if (songs && songs.length) {
      histTracks = [...songs].reverse().map(s => ({
        title:    s.song.title,
        artist:   (s.song.interpreters || []).join(', '),
        time:     new Date(s.startTime * 1000).toLocaleTimeString('fr-FR', {hour:'2-digit',minute:'2-digit'}),
        ts: s.startTime, selected: false, done: false
      }));
      renderHist();
      btn.disabled = false; btn.textContent = 'Charger';
      return;
    }
  } catch(e) {}

  // 2. Fallback proxy (titres récents seulement)
  const TARGET = 'https://api.radiofrance.fr/livemeta/pull/7';
  const PROXIES = [
    u => `https://corsproxy.io/?${encodeURIComponent(u)}`,
    u => `https://api.allorigins.win/get?url=${encodeURIComponent(u)}`,
  ];
  for (const proxy of PROXIES) {
    try {
      const res  = await fetchWithTimeout(proxy(TARGET), 6000);
      const json = await res.json();
      const raw  = json.contents !== undefined ? json.contents : JSON.stringify(json);
      const data = JSON.parse(raw);
      const steps = Object.values(data.steps || {})
        .filter(s => s.title)
        .sort((a, b) => b.start - a.start);
      if (steps.length) {
        histTracks = steps.map(s => ({
          title: s.title, artist: s.authors || s.performers || '',
          time:  new Date(s.start * 1000).toLocaleTimeString('fr-FR', {hour:'2-digit',minute:'2-digit'}),
          ts: s.start, selected: false, done: false
        }));
        renderHist();
        setFipHistStatus('⚠ Seulement les titres très récents disponibles', true);
        btn.disabled = false; btn.textContent = 'Charger';
        return;
      }
    } catch(e) {}
  }

  list.innerHTML = '<div class="h-empty">Historique non disponible.<br>L\'API FIP bloque les requêtes cross-origin depuis une appli web.</div>';
  document.getElementById('fip-select-controls').style.display = 'none';
  btn.disabled = false; btn.textContent = 'Charger';
}

function renderHist() {
  const list = document.getElementById('fip-hist-list');
  if (!histTracks.length) {
    list.innerHTML = '<div class="h-empty">Aucun titre trouvé</div>';
    document.getElementById('fip-select-controls').style.display = 'none';
    return;
  }
  document.getElementById('fip-select-controls').style.display = 'block';
  list.innerHTML = histTracks.map((t, i) => `
    <div class="fh-item ${t.selected ? 'selected' : ''} ${t.done ? 'done' : ''}" onclick="toggleHist(${i})">
      <div class="fh-check">${t.selected || t.done ? '✓' : ''}</div>
      <div class="fh-info">
        <div class="fh-track">${t.title}</div>
        <div class="fh-artist">${t.artist}</div>
      </div>
      <div class="fh-time">${t.time}</div>
    </div>`).join('');
  updateScrobbleBtn();
}

function toggleHist(i) {
  if (histTracks[i].done) return;
  histTracks[i].selected = !histTracks[i].selected;
  renderHist();
}

function toggleSelectAll(cb) {
  histTracks.forEach(t => { if (!t.done) t.selected = cb.checked; });
  renderHist();
}

function updateScrobbleBtn() {
  const count = histTracks.filter(t => t.selected && !t.done).length;
  const btn = document.getElementById('btn-scrobble-all');
  const ctrl = document.getElementById('fip-select-controls');
  btn.disabled = count === 0;
  btn.textContent = `Ajouter ${count > 0 ? count + ' titre' + (count > 1 ? 's' : '') : 'la sélection'} à Qobuz`;
  ctrl.style.display = count > 0 ? 'block' : 'none';
}

async function scrobbleSelected() {
  const toAdd = histTracks.filter(t => t.selected && !t.done);
  if (!toAdd.length) return;
  const btn = document.getElementById('btn-scrobble-all');
  btn.disabled = true;
  let ok = 0, fail = 0;
  for (const t of toAdd) {
    const success = await scrobbleTrack(t.title, t.artist);
    if (success) { t.done = true; t.selected = false; ok++; }
    else fail++;
    await new Promise(r => setTimeout(r, 350));
  }
  renderHist();
  const msg = (ok ? `✓ ${ok} titre${ok > 1 ? 's' : ''} ajouté${ok > 1 ? 's' : ''}` : '') + (fail ? ` — ${fail} échec${fail > 1 ? 's' : ''}` : '');
  setFipHistStatus(msg, fail > 0);
  if (ok > 0) setTimeout(loadLastfmRecent, 2000);
}

function setFipHistStatus(msg, isErr) {
  const el = document.getElementById('fip-hist-status');
  el.textContent = msg;
  el.style.display = msg ? 'block' : 'none';
  el.style.color = isErr ? 'var(--red)' : 'var(--green)';
}
